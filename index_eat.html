<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식단기록앱</title>
  <style>
    /* ── CSS 변수 ── */
    :root {
      --color-primary: #FFD700;
      --color-primary-dark: #FFA500;
      --color-secondary: #4CAF50;
      --color-secondary-dark: #2E7D32;
      --color-danger: #F44336;
      --color-danger-dark: #C62828;
      --color-bg: #FFFDE7;
      --color-card: #FFFFFF;
      --color-text: #212121;
      --color-text-secondary: #757575;
      --color-border: #E0E0E0;
      --color-error-bg: #FFEBEE;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-card: 0 2px 8px rgba(0,0,0,0.10);
      --transition: 0.18s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      line-height: 1.5;
    }

    :focus-visible {
      outline: 3px solid var(--color-primary-dark);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      top: -100%;
      left: 0;
      background: var(--color-primary-dark);
      color: var(--color-text);
      padding: 8px 16px;
      z-index: 9999;
      font-weight: 700;
      border-radius: 0 0 var(--radius-sm) 0;
    }
    .skip-link:focus { top: 0; }

    .app-header {
      background-color: var(--color-primary);
      padding: 16px 20px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-header h1 {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--color-text);
    }

    .app-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }

    .date-nav {
      background-color: var(--color-primary);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      padding: 12px 16px 16px;
      margin: 0 -16px 20px;
      text-align: center;
    }
    .date-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto 8px;
    }
    .date-display {
      font-size: clamp(0.95rem, 3vw, 1.15rem);
      font-weight: 700;
      color: var(--color-text);
      flex: 1;
      text-align: center;
    }
    .btn-nav {
      background: rgba(255,255,255,0.6);
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--color-text);
      transition: background var(--transition);
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-nav:hover { background: rgba(255,255,255,0.9); }
    .btn-today {
      background: var(--color-text);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 6px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity var(--transition), background var(--transition);
      min-height: 36px;
    }
    .btn-today:hover:not(:disabled) { background: #424242; }
    .btn-today:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .card {
      background: var(--color-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--color-text);
    }

    .form-group {
      margin-bottom: 14px;
      position: relative;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 5px;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      color: var(--color-text);
      background: #fff;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-input:focus {
      border-color: var(--color-primary-dark);
      box-shadow: 0 0 0 3px rgba(255,165,0,0.18);
      outline: none;
    }
    .form-input.error {
      border-color: var(--color-danger);
      box-shadow: 0 0 0 3px rgba(244,67,54,0.13);
      background-color: var(--color-error-bg);
    }
    .form-error {
      font-size: 0.78rem;
      color: var(--color-danger);
      margin-top: 4px;
      display: none;
    }
    .form-error.visible { display: block; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .calorie-preview {
      text-align: center;
      padding: 10px;
      background: #F9FBE7;
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      color: var(--color-text-secondary);
      margin-bottom: 14px;
      border: 1px dashed #C5E1A5;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .calorie-preview strong {
      font-size: 1.2rem;
      color: var(--color-secondary-dark);
      font-weight: 800;
    }

    .btn-add {
      width: 100%;
      padding: 13px;
      background: var(--color-secondary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition), transform 0.1s;
      min-height: 48px;
    }
    .btn-add:hover { background: var(--color-secondary-dark); }
    .btn-add:active { transform: scale(0.98); }

    .autocomplete-wrapper { position: relative; }
    .autocomplete-list {
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 200;
      max-height: 240px;
      overflow-y: auto;
      list-style: none;
    }
    .autocomplete-list[hidden] { display: none; }
    .autocomplete-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      transition: background var(--transition);
      border-bottom: 1px solid #F5F5F5;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover,
    .autocomplete-item[aria-selected="true"] {
      background: #FFF9C4;
    }
    .autocomplete-item-cal {
      font-size: 0.78rem;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }

    .total-section {
      background: var(--color-secondary);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
    }
    .total-label {
      font-size: 1rem;
      font-weight: 600;
      opacity: 0.95;
    }
    .total-value {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .total-unit {
      font-size: 0.9rem;
      font-weight: 400;
      opacity: 0.85;
      margin-left: 2px;
    }

    .list-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .entry-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .entry-item {
      background: var(--color-card);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      transition: box-shadow var(--transition);
    }
    .entry-item:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.10); }
    .entry-info {
      flex: 1;
      min-width: 0;
    }
    .entry-name {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-meta {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
    }
    .entry-calories {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--color-secondary-dark);
      white-space: nowrap;
    }
    .entry-cal-unit {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--color-text-secondary);
    }
    .btn-delete {
      background: none;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      color: var(--color-danger);
      font-size: 1rem;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
      flex-shrink: 0;
    }
    .btn-delete:hover {
      background: var(--color-danger);
      border-color: var(--color-danger);
      color: #fff;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--color-text-secondary);
    }
    .empty-state-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
      display: block;
    }
    .empty-state p {
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: #323232;
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.22);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.25s, transform 0.25s;
      max-width: 320px;
      text-align: center;
      pointer-events: auto;
    }
    .toast.toast-error { background: var(--color-danger); }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 767px) {
      .app-container { padding: 0 12px 32px; }
      .card { padding: 16px; }
      .form-row { grid-template-columns: 1fr; gap: 4px; }
      .total-value { font-size: 1.3rem; }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      .app-container { max-width: 600px; }
    }
    @media (min-width: 1024px) {
      .app-container { max-width: 800px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <header class="app-header" role="banner">
    <h1>🥗 식단기록앱</h1>
  </header>

  <main id="main-content" class="app-container" role="main">

    <nav class="date-nav" aria-label="날짜 탐색">
      <div class="date-nav-row">
        <button class="btn-nav" id="btnPrev" aria-label="이전 날">◀ 이전</button>
        <span class="date-display" id="dateDisplay" aria-live="polite" aria-atomic="true"></span>
        <button class="btn-nav" id="btnNext" aria-label="다음 날">다음 ▶</button>
      </div>
      <button class="btn-today" id="btnToday" type="button">오늘</button>
    </nav>

    <section class="card" aria-labelledby="form-section-title">
      <h2 class="card-title" id="form-section-title">음식 추가</h2>

      <form id="addFoodForm" novalidate autocomplete="off">

        <div class="form-group autocomplete-wrapper">
          <label class="form-label" for="inputFoodName">음식명</label>
          <input
            class="form-input"
            type="text"
            id="inputFoodName"
            placeholder="음식명을 입력하세요"
            aria-autocomplete="list"
            aria-controls="autocompleteList"
            aria-haspopup="listbox"
            aria-expanded="false"
            autocomplete="off"
            maxlength="50"
          />
          <span class="form-error" id="errorFoodName" role="alert"></span>
          <ul
            class="autocomplete-list"
            id="autocompleteList"
            role="listbox"
            aria-label="음식 검색 결과"
            hidden
          ></ul>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="inputAmount">섭취량 (g)</label>
            <input
              class="form-input"
              type="number"
              id="inputAmount"
              placeholder="예: 200"
              min="1"
              max="9999"
              step="1"
              inputmode="numeric"
            />
            <span class="form-error" id="errorAmount" role="alert"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="inputCalPer100g">칼로리 (kcal/100g)</label>
            <input
              class="form-input"
              type="number"
              id="inputCalPer100g"
              placeholder="예: 130"
              min="0"
              max="9999"
              step="1"
              inputmode="numeric"
            />
            <span class="form-error" id="errorCalPer100g" role="alert"></span>
          </div>
        </div>

        <div class="calorie-preview" id="caloriePreview" aria-live="polite" aria-atomic="true">
          섭취량과 칼로리를 입력하면 예상 칼로리가 표시됩니다
        </div>

        <button class="btn-add" type="submit" id="btnAdd">+ 추가하기</button>
      </form>
    </section>

    <div class="total-section" role="status" aria-label="오늘 총 섭취 칼로리">
      <span class="total-label">🔥 오늘 총 섭취</span>
      <span>
        <span class="total-value" id="totalCalories">0</span>
        <span class="total-unit">kcal</span>
      </span>
    </div>

    <section aria-labelledby="list-section-title">
      <h2 class="list-title" id="list-section-title">📋 오늘의 식단</h2>
      <ul class="entry-list" id="entryList" aria-label="식단 목록"></ul>
    </section>

  </main>

  <div class="toast-container" id="toastContainer" aria-live="assertive" aria-atomic="true"></div>

  <script>
    const FOOD_DATABASE = [
      { name: "흰쌀밥",        calories: 130 },
      { name: "현미밥",        calories: 111 },
      { name: "잡곡밥",        calories: 120 },
      { name: "김치찌개",      calories: 46  },
      { name: "된장찌개",      calories: 40  },
      { name: "순두부찌개",    calories: 47  },
      { name: "불고기",        calories: 177 },
      { name: "삼겹살",        calories: 331 },
      { name: "닭갈비",        calories: 130 },
      { name: "제육볶음",      calories: 180 },
      { name: "비빔밥",        calories: 130 },
      { name: "냉면",          calories: 98  },
      { name: "국수",          calories: 130 },
      { name: "라면",          calories: 450 },
      { name: "떡볶이",        calories: 140 },
      { name: "순대",          calories: 177 },
      { name: "김밥",          calories: 164 },
      { name: "닭볶음탕",      calories: 95  },
      { name: "갈비탕",        calories: 74  },
      { name: "설렁탕",        calories: 58  },
      { name: "삼계탕",        calories: 68  },
      { name: "부대찌개",      calories: 69  },
      { name: "감자탕",        calories: 86  },
      { name: "해물파전",      calories: 185 },
      { name: "잡채",          calories: 130 },
      { name: "계란후라이",    calories: 170 },
      { name: "계란찜",        calories: 80  },
      { name: "두부조림",      calories: 97  },
      { name: "시금치나물",    calories: 28  },
      { name: "콩나물무침",    calories: 30  },
      { name: "깍두기",        calories: 22  },
      { name: "배추김치",      calories: 18  },
      { name: "미역국",        calories: 18  },
      { name: "고등어구이",    calories: 183 },
      { name: "소고기 불고기", calories: 220 }
    ];

    let state = {
      currentDate: getTodayString(),
      entries: []
    };

    const STORAGE_PREFIX = 'diet_';

    function isValidEntry(e) {
      return (
        e !== null &&
        typeof e === 'object' &&
        typeof e.id === 'string' && e.id.length > 0 &&
        typeof e.name === 'string' && e.name.trim().length > 0 &&
        typeof e.amount === 'number' && e.amount > 0 &&
        typeof e.caloriesPer100g === 'number' && e.caloriesPer100g >= 0 &&
        typeof e.totalCalories === 'number' && !isNaN(e.totalCalories)
      );
    }

    function loadFromStorage(date) {
      try {
        const raw = localStorage.getItem(STORAGE_PREFIX + date);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.entries)) return [];
        const valid = parsed.entries.filter(isValidEntry);
        if (valid.length !== parsed.entries.length) {
          console.warn('[식단기록앱] 손상된 항목이 필터링되었습니다:', parsed.entries.length - valid.length, '개');
        }
        return valid;
      } catch (e) {
        console.warn('[식단기록앱] 저장 데이터 파싱 오류:', e);
        return [];
      }
    }

    function saveToStorage(date, entries) {
      try {
        const payload = JSON.stringify({ date, entries });
        localStorage.setItem(STORAGE_PREFIX + date, payload);
      } catch (e) {
        if (e.name === 'QuotaExceededError' || e.code === 22) {
          window.dispatchEvent(new CustomEvent('diet:storageError', {
            detail: { message: '저장 공간이 부족합니다. 오래된 기록을 삭제해 주세요.' }
          }));
        } else {
          console.error('[식단기록앱] 저장 오류:', e);
        }
      }
    }

    function deleteFromStorage(date) {
      try {
        localStorage.removeItem(STORAGE_PREFIX + date);
      } catch (e) {
        console.warn('[식단기록앱] 삭제 오류:', e);
      }
    }

    function getTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDateKorean(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const dayName = days[date.getDay()];
      return `${y}년 ${m}월 ${d}일 (${dayName})`;
    }

    function addDays(dateStr, days) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + days);
      const ny = date.getFullYear();
      const nm = String(date.getMonth() + 1).padStart(2, '0');
      const nd = String(date.getDate()).padStart(2, '0');
      return `${ny}-${nm}-${nd}`;
    }

    function calcCalories(amount, per100g) {
      return Math.round(amount * per100g / 100);
    }

    function calcDailyTotal(entries) {
      return entries.reduce((sum, e) => sum + (e.totalCalories || 0), 0);
    }

    function generateId() {
      return `entry_${Date.now()}_${String(Math.floor(Math.random() * 1000000)).padStart(6, '0')}`;
    }

    function validateEntry(name, amount, caloriesPer100g) {
      const errors = {};
      const trimmedName = (name || '').trim();

      if (!trimmedName) {
        errors.name = '음식명을 입력해 주세요.';
      } else if (trimmedName.length > 50) {
        errors.name = '음식명은 50자 이하로 입력해 주세요.';
      }

      const trimmedAmount = String(amount == null ? '' : amount).trim();
      const parsedAmount = Number(trimmedAmount);
      if (trimmedAmount === '') {
        errors.amount = '섭취량을 입력해 주세요.';
      } else if (isNaN(parsedAmount) || parsedAmount <= 0) {
        errors.amount = '섭취량은 0보다 큰 숫자여야 합니다.';
      } else if (parsedAmount > 9999) {
        errors.amount = '섭취량은 9999g 이하로 입력해 주세요.';
      }

      const trimmedCal = String(caloriesPer100g == null ? '' : caloriesPer100g).trim();
      const parsedCal = Number(trimmedCal);
      if (trimmedCal === '') {
        errors.caloriesPer100g = '칼로리를 입력해 주세요.';
      } else if (isNaN(parsedCal) || parsedCal < 0) {
        errors.caloriesPer100g = '칼로리는 0 이상의 숫자여야 합니다.';
      } else if (parsedCal > 9999) {
        errors.caloriesPer100g = '칼로리는 9999 이하로 입력해 주세요.';
      }

      return {
        isValid: Object.keys(errors).length === 0,
        errors
      };
    }

    function createEntry(name, amount, caloriesPer100g) {
      const validation = validateEntry(name, amount, caloriesPer100g);
      if (!validation.isValid) {
        return { isValid: false, errors: validation.errors };
      }
      const trimmedName = name.trim();
      const parsedAmount = Number(amount);
      const parsedCal = Number(caloriesPer100g);
      const entry = {
        id: generateId(),
        name: trimmedName,
        amount: parsedAmount,
        caloriesPer100g: parsedCal,
        totalCalories: calcCalories(parsedAmount, parsedCal)
      };
      return { isValid: true, entry };
    }

    function searchFoods(query) {
      if (!query || !query.trim()) return [];
      const q = query.trim().toLowerCase();
      return FOOD_DATABASE
        .filter(f => f.name.toLowerCase().includes(q))
        .slice(0, 8);
    }

    function switchDate(dateStr) {
      state.currentDate = dateStr;
      state.entries = loadFromStorage(dateStr);
    }

    function addEntry(entry) {
      state.entries.push(entry);
      saveToStorage(state.currentDate, state.entries);
    }

    function removeEntry(id) {
      state.entries = state.entries.filter(e => e.id !== id);
      if (state.entries.length === 0) {
        deleteFromStorage(state.currentDate);
      } else {
        saveToStorage(state.currentDate, state.entries);
      }
    }

    function showToast(message, type = 'default', duration = 3000) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast' + (type === 'error' ? ' toast-error' : '');
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => { toast.classList.add('show'); });
      });
      setTimeout(() => {
        toast.classList.remove('show');
        toast.addEventListener('transitionend', () => toast.remove(), { once: true });
      }, duration);
    }

    function renderDateNav() {
      const today = getTodayString();
      const isToday = state.currentDate === today;
      const dateDisplay = document.getElementById('dateDisplay');
      dateDisplay.textContent = formatDateKorean(state.currentDate);
      const btnToday = document.getElementById('btnToday');
      btnToday.disabled = isToday;
      btnToday.setAttribute('aria-disabled', String(isToday));
    }

    function renderTotal() {
      const total = calcDailyTotal(state.entries);
      const el = document.getElementById('totalCalories');
      el.textContent = total.toLocaleString('ko-KR');
    }

    function renderEntryList() {
      const list = document.getElementById('entryList');
      while (list.firstChild) list.removeChild(list.firstChild);

      if (state.entries.length === 0) {
        const emptyDiv = document.createElement('li');
        emptyDiv.setAttribute('role', 'presentation');
        const emptyState = document.createElement('div');
        emptyState.className = 'empty-state';
        const icon = document.createElement('span');
        icon.className = 'empty-state-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = '🍽️';
        const p = document.createElement('p');
        p.textContent = '아직 기록된 식단이 없습니다.\n위 폼에서 음식을 추가해 보세요!';
        p.style.whiteSpace = 'pre-line';
        emptyState.appendChild(icon);
        emptyState.appendChild(p);
        emptyDiv.appendChild(emptyState);
        list.appendChild(emptyDiv);
        return;
      }

      state.entries.forEach(entry => {
        const li = document.createElement('li');
        li.className = 'entry-item';
        li.dataset.id = entry.id;
        const infoDiv = document.createElement('div');
        infoDiv.className = 'entry-info';
        const nameEl = document.createElement('div');
        nameEl.className = 'entry-name';
        nameEl.textContent = entry.name;
        nameEl.title = entry.name;
        const metaEl = document.createElement('div');
        metaEl.className = 'entry-meta';
        metaEl.textContent = `${entry.amount.toLocaleString('ko-KR')}g  •  ${entry.caloriesPer100g} kcal/100g`;
        infoDiv.appendChild(nameEl);
        infoDiv.appendChild(metaEl);
        const calDiv = document.createElement('div');
        calDiv.style.textAlign = 'right';
        calDiv.style.flexShrink = '0';
        const calVal = document.createElement('span');
        calVal.className = 'entry-calories';
        calVal.textContent = entry.totalCalories.toLocaleString('ko-KR');
        const calUnit = document.createElement('span');
        calUnit.className = 'entry-cal-unit';
        calUnit.textContent = ' kcal';
        calDiv.appendChild(calVal);
        calDiv.appendChild(calUnit);
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete';
        delBtn.type = 'button';
        delBtn.setAttribute('aria-label', `${entry.name} 삭제`);
        delBtn.dataset.id = entry.id;
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', () => {
          removeEntry(entry.id);
          renderAll();
          showToast(`"${entry.name}" 항목이 삭제되었습니다.`);
        });
        li.appendChild(infoDiv);
        li.appendChild(calDiv);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    function renderAll() {
      renderDateNav();
      renderTotal();
      renderEntryList();
    }

    let acSelectedIndex = -1;
    let acResults = [];

    function openAutocomplete(results) {
      const list = document.getElementById('autocompleteList');
      const input = document.getElementById('inputFoodName');
      while (list.firstChild) list.removeChild(list.firstChild);
      if (results.length === 0) { closeAutocomplete(); return; }
      acResults = results;
      acSelectedIndex = -1;
      results.forEach((food, idx) => {
        const li = document.createElement('li');
        li.className = 'autocomplete-item';
        li.setAttribute('role', 'option');
        li.setAttribute('aria-selected', 'false');
        li.dataset.index = String(idx);
        li.id = `ac-item-${idx}`;
        const nameSpan = document.createElement('span');
        nameSpan.textContent = food.name;
        const calSpan = document.createElement('span');
        calSpan.className = 'autocomplete-item-cal';
        calSpan.textContent = `${food.calories} kcal/100g`;
        li.appendChild(nameSpan);
        li.appendChild(calSpan);
        li.addEventListener('mousedown', (e) => { e.preventDefault(); selectAutocompleteItem(idx); });
        list.appendChild(li);
      });
      list.hidden = false;
      input.setAttribute('aria-expanded', 'true');
    }

    function closeAutocomplete() {
      const list = document.getElementById('autocompleteList');
      const input = document.getElementById('inputFoodName');
      list.hidden = true;
      input.setAttribute('aria-expanded', 'false');
      acSelectedIndex = -1;
      acResults = [];
    }

    function highlightAutocompleteItem(index) {
      const list = document.getElementById('autocompleteList');
      const items = list.querySelectorAll('.autocomplete-item');
      items.forEach((item, i) => {
        const selected = i === index;
        item.setAttribute('aria-selected', String(selected));
        if (selected) item.scrollIntoView({ block: 'nearest' });
      });
    }

    function selectAutocompleteItem(index) {
      const food = acResults[index];
      if (!food) return;
      const inputName = document.getElementById('inputFoodName');
      const inputCal = document.getElementById('inputCalPer100g');
      inputName.value = food.name;
      inputCal.value = String(food.calories);
      clearFieldError('inputFoodName', 'errorFoodName');
      clearFieldError('inputCalPer100g', 'errorCalPer100g');
      closeAutocomplete();
      updateCaloriePreview();
      document.getElementById('inputAmount').focus();
    }

    function updateCaloriePreview() {
      const amount = parseFloat(document.getElementById('inputAmount').value);
      const cal = parseFloat(document.getElementById('inputCalPer100g').value);
      const preview = document.getElementById('caloriePreview');
      while (preview.firstChild) preview.removeChild(preview.firstChild);
      if (!isNaN(amount) && amount > 0 && !isNaN(cal) && cal >= 0) {
        const result = calcCalories(amount, cal);
        const labelText = document.createTextNode('예상 칼로리: ');
        const strong = document.createElement('strong');
        strong.textContent = result.toLocaleString('ko-KR');
        const unitText = document.createTextNode(' kcal');
        preview.appendChild(labelText);
        preview.appendChild(strong);
        preview.appendChild(unitText);
      } else {
        preview.textContent = '섭취량과 칼로리를 입력하면 예상 칼로리가 표시됩니다';
      }
    }

    function showFieldError(inputId, errorId, message) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(errorId);
      input.classList.add('error');
      error.textContent = message;
      error.classList.add('visible');
    }

    function clearFieldError(inputId, errorId) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(errorId);
      input.classList.remove('error');
      error.textContent = '';
      error.classList.remove('visible');
    }

    function clearAllErrors() {
      clearFieldError('inputFoodName', 'errorFoodName');
      clearFieldError('inputAmount', 'errorAmount');
      clearFieldError('inputCalPer100g', 'errorCalPer100g');
    }

    document.getElementById('btnPrev').addEventListener('click', () => {
      switchDate(addDays(state.currentDate, -1));
      renderAll();
    });
    document.getElementById('btnNext').addEventListener('click', () => {
      switchDate(addDays(state.currentDate, 1));
      renderAll();
    });
    document.getElementById('btnToday').addEventListener('click', () => {
      switchDate(getTodayString());
      renderAll();
    });

    document.getElementById('inputFoodName').addEventListener('input', (e) => {
      clearFieldError('inputFoodName', 'errorFoodName');
      const query = e.target.value;
      if (query.trim().length === 0) { closeAutocomplete(); return; }
      openAutocomplete(searchFoods(query));
    });

    document.getElementById('inputFoodName').addEventListener('keydown', (e) => {
      const list = document.getElementById('autocompleteList');
      if (list.hidden) return;
      const itemCount = acResults.length;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        acSelectedIndex = Math.min(acSelectedIndex + 1, itemCount - 1);
        highlightAutocompleteItem(acSelectedIndex);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        acSelectedIndex = Math.max(acSelectedIndex - 1, -1);
        highlightAutocompleteItem(acSelectedIndex);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (acSelectedIndex >= 0) selectAutocompleteItem(acSelectedIndex);
      } else if (e.key === 'Escape') {
        closeAutocomplete();
      }
    });

    document.getElementById('inputFoodName').addEventListener('blur', () => {
      setTimeout(closeAutocomplete, 150);
    });

    document.getElementById('inputAmount').addEventListener('input', () => {
      clearFieldError('inputAmount', 'errorAmount');
      updateCaloriePreview();
    });
    document.getElementById('inputCalPer100g').addEventListener('input', () => {
      clearFieldError('inputCalPer100g', 'errorCalPer100g');
      updateCaloriePreview();
    });

    document.addEventListener('click', (e) => {
      const wrapper = document.querySelector('.autocomplete-wrapper');
      if (!wrapper.contains(e.target)) closeAutocomplete();
    });

    document.getElementById('addFoodForm').addEventListener('submit', (e) => {
      e.preventDefault();
      clearAllErrors();
      const name = document.getElementById('inputFoodName').value;
      const amount = document.getElementById('inputAmount').value;
      const cal = document.getElementById('inputCalPer100g').value;
      const result = createEntry(name, amount, cal);
      if (!result.isValid) {
        if (result.errors.name) showFieldError('inputFoodName', 'errorFoodName', result.errors.name);
        if (result.errors.amount) showFieldError('inputAmount', 'errorAmount', result.errors.amount);
        if (result.errors.caloriesPer100g) showFieldError('inputCalPer100g', 'errorCalPer100g', result.errors.caloriesPer100g);
        if (result.errors.name) document.getElementById('inputFoodName').focus();
        else if (result.errors.amount) document.getElementById('inputAmount').focus();
        else document.getElementById('inputCalPer100g').focus();
        return;
      }
      addEntry(result.entry);
      renderAll();
      document.getElementById('addFoodForm').reset();
      updateCaloriePreview();
      closeAutocomplete();
      showToast(`"${result.entry.name}" 이(가) 추가되었습니다.`);
      document.getElementById('inputFoodName').focus();
    });

    window.addEventListener('diet:storageError', (e) => {
      const msg = (e.detail && e.detail.message)
        ? e.detail.message
        : '저장 공간이 부족합니다. 오래된 기록을 삭제해 주세요.';
      showToast(msg, 'error', 5000);
    });

    (function init() {
      state.currentDate = getTodayString();
      state.entries = loadFromStorage(state.currentDate);
      renderAll();
    })();
  </script>
</body>
</html>
